  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      var body = document.body;
      var toggles = Array.prototype.slice.call(document.querySelectorAll('[data-menu-toggle]'));

      function closeAll() {
        body.classList.remove('menu-open', 'menu-open--interessen', 'menu-open--projekte');
        toggles.forEach(function (t) { t.setAttribute('aria-expanded', 'false'); });
      }

      toggles.forEach(function (t) {
        t.addEventListener('click', function (e) {
          e.preventDefault();
          var cls = 'menu-open--' + t.getAttribute('data-menu-toggle');
          var wasOpen = body.classList.contains(cls);
          closeAll();
          if (!wasOpen) {
            body.classList.add('menu-open', cls);
            t.setAttribute('aria-expanded', 'true');
          }
        });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeAll();
      });
    })();
  </script>
